name: patient_mobile_app
description: MedFlow Patient Mobile App connected to MedFlow backend with Bhashini support.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.2
  geolocator: ^14.0.3
  speech_to_text: ^7.4.0
  image_picker: ^1.2.3
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
